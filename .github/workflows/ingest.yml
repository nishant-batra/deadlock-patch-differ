name: Ingest patch data

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  # A GitHub issue per new build; its notification email is the alert.
  issues: write

concurrency:
  group: ingest-patch-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingest
        id: ingest
        run: pnpm run ingest

      # The push triggers a Vercel build, which prerenders the pages and
      # regenerates sitemap.xml from them.
      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain app/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/data
            git commit -m "chore: update patch data"
            git push
          else
            echo "No data changes, skipping commit."
          fi

      # Runs only after the push succeeded, so the issue never announces data
      # the site does not have. Assigning the repo owner makes GitHub email them
      # even if they stop watching the repo.
      - name: Open an issue for the new build
        if: steps.ingest.outputs.notify == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: ${{ steps.ingest.outputs.title }}
          BODY_FILE: ${{ steps.ingest.outputs.body_file }}
        run: |
          gh issue create --repo "$GITHUB_REPOSITORY" \
            --title "$TITLE" --body-file "$BODY_FILE" \
            --assignee "$GITHUB_REPOSITORY_OWNER"
