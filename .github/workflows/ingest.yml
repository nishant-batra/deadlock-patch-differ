name: Ingest patch data

on:
  schedule:
    - cron: "15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ingest-patch-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ingest
        id: ingest
        run: pnpm run ingest

      # The push triggers a Vercel build, which prerenders the pages and
      # regenerates sitemap.xml from them.
      - name: Commit and push if data changed
        run: |
          if [ -n "$(git status --porcelain app/data)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add app/data
            git commit -m "chore: update patch data"
            git push
          else
            echo "No data changes, skipping commit."
          fi

      # Runs only after the push succeeded, so the email never announces data
      # the site does not have. Without a verified domain, Resend only delivers
      # to the account's own signup address, so NOTIFY_EMAIL must be that.
      - name: Email the new build
        if: steps.ingest.outputs.notify == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          NOTIFY_EMAIL: ${{ secrets.NOTIFY_EMAIL }}
          TITLE: ${{ steps.ingest.outputs.title }}
          BODY_FILE: ${{ steps.ingest.outputs.body_file }}
        run: |
          jq -n --arg to "$NOTIFY_EMAIL" --arg subject "$TITLE" --rawfile text "$BODY_FILE" \
            '{from: "Deadlock Patch <onboarding@resend.dev>", to: [$to], subject: $subject, text: $text}' |
            curl --fail-with-body -sS https://api.resend.com/emails \
              -H "Authorization: Bearer $RESEND_API_KEY" \
              -H "Content-Type: application/json" \
              --data-binary @-
